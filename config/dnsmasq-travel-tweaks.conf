# Travel router dnsmasq optimizations
# Install to: /etc/dnsmasq.d/travel-tweaks.conf

# Larger DNS cache (default is 150 — far too small for travel)
cache-size=2048

# Override low TTLs from hotel/captive portal DNS (prevents constant upstream queries)
min-cache-ttl=300

# Negative cache TTL (cache NXDOMAIN for 60s)
neg-ttl=60

# Increase concurrent DNS query slots
dns-forward-max=300

# Carrier stealth (Visible/Verizon): advertise cellular MTU to clients via DHCP Option 26.
# Prevents client UDP fragmentation (WireGuard, DTLS, QUIC) without relying solely on TCP MSS clamping.
dhcp-option=26,1420

# OS fingerprinting protection: sinkhole vendor NTP queries to local gateway.
# Prevents desktop OS queries (time.windows.com, time.apple.com) from identifying tethered devices to carrier DPI.
address=/time.windows.com/10.3.141.1
address=/time.apple.com/10.3.141.1
address=/time.android.com/10.3.141.1

# Uncomment to use fastest responding upstream:
# all-servers

# Uncomment to log all DNS queries for debugging:
# log-queries
