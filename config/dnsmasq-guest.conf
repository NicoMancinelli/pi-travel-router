# dnsmasq config for guest network — 192.168.5.0/24
# Installed to /etc/dnsmasq.d/guest.conf when ENABLE_GUEST_NETWORK=1
# MUTUAL EXCLUSION: this config binds uap1. Do NOT enable alongside ENABLE_TOR_TRANSPARENT=1
# (dnsmasq-tor-ap.conf also binds uap1 — both active will prevent dnsmasq from starting).

interface=uap1
bind-interfaces
dhcp-range=192.168.5.10,192.168.5.200,255.255.255.0,12h
dhcp-option=3,192.168.5.1
dhcp-option=6,192.168.5.1
no-hosts
