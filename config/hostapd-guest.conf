# Guest AP hostapd configuration — second virtual AP on uap1
# Interface uap1 is created from wlan0 at install time / service start.
# IMPORTANT: wpa_passphrase is written at install time; if GUEST_PASS is
# empty the wpa=, wpa_key_mgmt=, rsn_pairwise=, and wpa_passphrase= lines
# are removed so the network is open (no WPA).

interface=uap1
driver=nl80211
ssid=TravelRouter-Guest
hw_mode=g
channel=6
wmm_enabled=1
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# wpa_passphrase is set at install time (or removed for open network)
