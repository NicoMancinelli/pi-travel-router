name: Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'firstboot/**'
      - 'tests/**'
      - 'install/**'
      - 'web/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'firstboot/**'
      - 'tests/**'
      - 'install/**'
      - 'web/**'
      - '.github/workflows/unit-tests.yml'

jobs:
  bats:
    name: Bash unit tests (bats-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats-core
        run: |
          sudo apt-get install -y bats
      - name: Run bats tests
        run: bats tests/unit/

  pytest:
    name: Python unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pytest flask
      - name: Run pytest
        run: pytest tests/unit/ -v

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats
          pip install flask requests pytest --quiet
      - name: Run integration tests (bats)
        run: bats tests/integration/
      - name: Run integration tests (pytest)
        run: python3 -m pytest tests/integration/ -v

  test-arm64:
    name: Unit tests on ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats python3 python3-pip python3-pytest
          pip3 install flask requests --quiet
      - name: Run unit tests natively on ARM64
        run: bats tests/unit/
      - name: Run pytest natively on ARM64
        run: python3 -m pytest tests/unit/ -v
